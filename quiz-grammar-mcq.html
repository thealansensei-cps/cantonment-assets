<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grammar MCQ | English Island</title>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(160deg, #0b3d25 0%, #1a6b45 45%, #0e4f30 100%);
      min-height: 100vh;
      padding: 20px 16px 40px;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      color: #fff;
      margin-bottom: 24px;
    }
    .island-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.25);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      padding: 5px 14px;
      border-radius: 20px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    .header h1 {
      font-size: 26px;
      font-weight: 900;
      text-shadow: 0 2px 10px rgba(0,0,0,0.35);
    }
    .header .subtitle {
      font-size: 14px;
      opacity: 0.8;
      margin-top: 4px;
    }
    .student-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 14px;
      font-weight: 700;
      margin-top: 10px;
      color: #fff;
    }

    /* ── Progress ── */
    .progress-wrap {
      max-width: 600px;
      margin: 16px auto 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .progress-track {
      flex: 1;
      height: 8px;
      background: rgba(255,255,255,0.2);
      border-radius: 20px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #f5a623, #ffd166);
      border-radius: 20px;
      transition: width 0.5s ease;
      width: 0%;
    }
    .progress-label {
      font-size: 12px;
      font-weight: 700;
      color: rgba(255,255,255,0.75);
      min-width: 40px;
      text-align: right;
    }

    /* ── Quiz Card ── */
    .quiz-card {
      background: #fff;
      border-radius: 24px;
      padding: 28px 28px 24px;
      max-width: 640px;
      margin: 0 auto 20px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.18);
    }
    .q-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .q-badge {
      background: #e6f4ed;
      color: #1a6b45;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 20px;
    }
    .q-source {
      font-size: 11px;
      color: #aaa;
      font-weight: 600;
    }
    .q-text {
      font-size: 17px;
      font-weight: 700;
      color: #1a1a2e;
      line-height: 1.55;
      margin-bottom: 20px;
    }
    .q-blank {
      display: inline-block;
      border-bottom: 2.5px solid #1a6b45;
      min-width: 100px;
      color: #1a6b45;
    }

    /* ── Options ── */
    .options { display: grid; gap: 10px; }
    .opt-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 16px;
      border: 2px solid #e8e8e8;
      border-radius: 14px;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      font-size: 15px;
      font-weight: 600;
      background: #fafafa;
      color: #1a1a2e;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
      text-align: left;
      width: 100%;
    }
    .opt-btn:hover:not(:disabled) {
      border-color: #1a6b45;
      background: #f0faf4;
      transform: translateX(3px);
    }
    .opt-num {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #e8e8e8;
      color: #555;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      flex-shrink: 0;
      transition: background 0.15s, color 0.15s;
    }
    .opt-btn:hover:not(:disabled) .opt-num { background: #1a6b45; color: #fff; }
    .opt-btn.correct  { border-color: #22c55e; background: #f0fdf4; }
    .opt-btn.correct .opt-num  { background: #22c55e; color: #fff; }
    .opt-btn.wrong    { border-color: #ef4444; background: #fef2f2; }
    .opt-btn.wrong .opt-num    { background: #ef4444; color: #fff; }
    .opt-btn:disabled { cursor: not-allowed; }

    /* ── Feedback ── */
    .feedback {
      margin-top: 14px;
      font-size: 14px;
      font-weight: 700;
      min-height: 22px;
      border-radius: 8px;
      padding: 0 4px;
    }
    .feedback.correct { color: #16a34a; }
    .feedback.wrong   { color: #dc2626; }

    /* ── Nav ── */
    .nav-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 22px;
    }
    .btn {
      padding: 11px 26px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      font-size: 15px;
      font-weight: 700;
      transition: all 0.2s;
    }
    .btn-primary { background: #1a6b45; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #155539; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(26,107,69,0.4); }
    .btn-ghost   { background: #f0f0f0; color: #555; }
    .btn-ghost:hover  { background: #e0e0e0; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

    /* ── Score Card ── */
    .score-card {
      background: #fff;
      border-radius: 24px;
      padding: 44px 28px 36px;
      max-width: 640px;
      margin: 0 auto;
      box-shadow: 0 12px 40px rgba(0,0,0,0.18);
      text-align: center;
      display: none;
    }
    .score-emoji { font-size: 68px; margin-bottom: 10px; animation: pop 0.5s ease; }
    @keyframes pop { 0%{transform:scale(0)} 70%{transform:scale(1.15)} 100%{transform:scale(1)} }
    .score-num  { font-size: 56px; font-weight: 900; color: #1a6b45; line-height: 1; }
    .score-denom { font-size: 24px; color: #aaa; font-weight: 700; }
    .score-section { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: #aaa; font-weight: 700; margin-top: 4px; margin-bottom: 20px; }
    .score-msg   { font-size: 20px; font-weight: 800; color: #1a1a2e; margin-bottom: 6px; }
    .score-sub   { font-size: 14px; color: #888; margin-bottom: 24px; }
    .save-pill {
      display: inline-block;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      background: #f3f3f3;
      color: #888;
      margin-bottom: 24px;
    }
    .save-pill.saved { background: #f0fdf4; color: #16a34a; }
    .save-pill.err   { background: #fef2f2; color: #dc2626; }

    @media (max-width: 480px) {
      .header h1 { font-size: 21px; }
      .quiz-card  { padding: 20px 18px; }
      .opt-btn    { font-size: 14px; padding: 11px 13px; }
      .q-text     { font-size: 16px; }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="island-badge">🌴 English Island</div>
    <h1>⚡ Grammar MCQ Challenge</h1>
    <div class="subtitle">10 questions from past papers</div>
    <div class="student-chip">👤 <span id="student-name">Loading…</span></div>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="prog"></div></div>
      <div class="progress-label" id="prog-label">0/10</div>
    </div>
  </div>

  <div class="quiz-card" id="quiz-card">
    <div class="q-header">
      <div class="q-badge" id="q-badge">Q1 of 10</div>
      <div class="q-source" id="q-src"></div>
    </div>
    <div class="q-text" id="q-text"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav-row">
      <button class="btn btn-ghost" onclick="history.back()">← Back</button>
      <button class="btn btn-primary" id="next-btn" onclick="nextQ()" disabled>Next →</button>
    </div>
  </div>

  <div class="score-card" id="score-card">
    <div class="score-emoji" id="sc-emoji">🏆</div>
    <div class="score-num" id="sc-num">0</div>
    <div class="score-denom">/10</div>
    <div class="score-section">Grammar MCQ</div>
    <div class="score-msg" id="sc-msg"></div>
    <div class="score-sub" id="sc-sub"></div>
    <div class="save-pill" id="save-pill">Saving…</div>
    <br>
    <button class="btn btn-ghost" onclick="goBackToIsland()">← Back to Island</button>
  </div>

<script>
window.onload = function () {

  /* ── Firebase ── */
  const cfg = {
    apiKey: "AIzaSyARwxGCCLctZLL64iQDlIOerRBdSf_Avfo",
    authDomain: "english-island-cps.firebaseapp.com",
    databaseURL: "https://english-island-cps-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "english-island-cps",
    storageBucket: "english-island-cps.firebasestorage.app",
    messagingSenderId: "892743482834",
    appId: "1:892743482834:web:6705bc3e3bc832cf749c0b"
  };
  if (!firebase.apps.length) firebase.initializeApp(cfg);
  const db = firebase.database();

  const params = new URLSearchParams(window.location.search);
  const studentName = params.get('hero') || params.get('name') || 'Guest';
  const studentCls  = params.get('cls') || '';
  document.getElementById('student-name').textContent = studentName;

  /* ── Questions ── */
  const questions = [
    {
      text: 'The two brothers __________ home when it suddenly started to rain.',
      opts: ['walked', 'is walking', 'has walked', 'were walking'],
      ans: 3, src: 'WA2 2024'
    },
    {
      text: 'Yip Pin Xiu won a gold medal at the Paralympics, __________ she faced many challenges along the way.',
      opts: ['but', 'despite', 'however', 'although'],
      ans: 3, src: 'WA2 2024'
    },
    {
      text: 'The teacher __________ surprised by how supportive her students were to one another.',
      opts: ['is', 'are', 'was', 'were'],
      ans: 2, src: 'WA2 2024'
    },
    {
      text: 'We __________ the ingredients together when the power suddenly went out.',
      opts: ['mix', 'mixed', 'are mixing', 'were mixing'],
      ans: 3, src: 'WA2 2025'
    },
    {
      text: 'The astronauts continued to train for the space mission __________ they were tired.',
      opts: ['so', 'but', 'unless', 'although'],
      ans: 3, src: 'WA2 2025'
    },
    {
      text: 'It was truly the __________ plant in his garden.',
      opts: ['tall', 'taller', 'tallest', 'most tallest'],
      ans: 2, src: 'WA2 2025'
    },
    {
      text: 'The vet __________ many animals since she started working at the clinic.',
      opts: ['treats', 'treated', 'is treating', 'has treated'],
      ans: 3, src: 'WA2 2025'
    },
    {
      text: 'Dinesh and his friend __________ amazed that they won the lucky draw last night.',
      opts: ['is', 'are', 'was', 'were'],
      ans: 3, src: 'EYE 2025'
    },
    {
      text: 'While I __________ the puppy, I heard someone call my name.',
      opts: ['feed', 'has fed', 'will feed', 'was feeding'],
      ans: 3, src: 'EYE 2025'
    },
    {
      text: 'There was __________ confusion among the people in the mall when the fire alarm went off.',
      opts: ['much', 'many', 'little', 'few'],
      ans: 0, src: 'EYE 2025'
    }
  ];

  let cur = 0, score = 0, total = 0, stars = 0, answered = false;
  const wrongQs = [];

  function render() {
    const q = questions[cur];
    document.getElementById('q-badge').textContent = `Q${cur + 1} of ${questions.length}`;
    document.getElementById('q-src').textContent = q.src;
    document.getElementById('q-text').textContent = q.text;
    document.getElementById('feedback').textContent = '';
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('next-btn').disabled = true;
    document.getElementById('next-btn').textContent = cur === questions.length - 1 ? 'Finish ✓' : 'Next →';
    answered = false;

    const container = document.getElementById('options');
    container.innerHTML = '';
    q.opts.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.innerHTML = `<span class="opt-num">${i + 1}</span><span>${opt}</span>`;
      btn.onclick = () => pick(i);
      container.appendChild(btn);
    });

    const pct = (cur / questions.length) * 100;
    document.getElementById('prog').style.width = pct + '%';
    document.getElementById('prog-label').textContent = `${cur}/${questions.length}`;
  }

  function pick(idx) {
    if (answered) return;
    answered = true;
    const q = questions[cur];
    const btns = document.querySelectorAll('.opt-btn');
    btns.forEach(b => b.disabled = true);

    if (idx === q.ans) {
      score++;
      btns[idx].classList.add('correct');
      document.getElementById('feedback').textContent = '✅ Correct!';
      document.getElementById('feedback').className = 'feedback correct';
    } else {
      btns[idx].classList.add('wrong');
      btns[q.ans].classList.add('correct');
      document.getElementById('feedback').textContent = `❌ The correct answer is: (${q.ans + 1}) ${q.opts[q.ans]}`;
      document.getElementById('feedback').className = 'feedback wrong';
      wrongQs.push({ q: q.text, src: q.src, chosen: q.opts[idx], correct: q.opts[q.ans] });
    }
    document.getElementById('next-btn').disabled = false;
  }

  window.nextQ = function () {
    if (!answered) return;
    cur++;
    if (cur < questions.length) {
      render();
    } else {
      showScore();
    }
  };

  function showScore() {
    document.getElementById('prog').style.width = '100%';
    document.getElementById('prog-label').textContent = `${questions.length}/${questions.length}`;
    document.getElementById('quiz-card').style.display = 'none';
    document.getElementById('score-card').style.display = 'block';

    total = questions.length;
    const pct = Math.round((score / total) * 100);
    document.getElementById('sc-num').textContent = score;

    let emoji, msg, sub;
    if      (pct >= 90) { emoji='🏆'; msg='Outstanding! Grammar Master!';      sub='You aced all 10 questions!' }
    else if (pct >= 70) { emoji='⭐'; msg='Great work, Island Explorer!';       sub='Strong grammar skills!' }
    else if (pct >= 50) { emoji='🌊'; msg='Good effort — keep practising!';     sub='Review the answers you missed.' }
    else                { emoji='🐚'; msg='Keep exploring and learning!';        sub='Revisit the grammar topics and try again.' }

    document.getElementById('sc-emoji').textContent = emoji;
    document.getElementById('sc-msg').textContent   = msg;
    document.getElementById('sc-sub').textContent   = sub;

    stars = pct >= 90 ? 3 : pct >= 70 ? 2 : pct >= 50 ? 1 : 0;
    const pill = document.getElementById('save-pill');
    if (studentName !== 'Guest') {
      db.ref(`scores/${studentName}/zone_gmcq`).set({ score, total, pts: score * 10, stars, ts: Date.now(), name: studentName, cls: studentCls, wrongQs })
        .then(() => { pill.textContent = '✅ Score saved!'; pill.className = 'save-pill saved'; })
        .catch(() => { pill.textContent = '⚠️ Could not save — tell your teacher'; pill.className = 'save-pill err'; });
    } else {
      pill.textContent = 'Guest mode — score not saved';
    }
  }

  function goBackToIsland() {
    window.location.href = 'student-portal.html?hero=' + encodeURIComponent(studentName)
      + '&cls=' + encodeURIComponent(studentCls)
      + '&zone=gmcq&score=' + score + '&total=' + total + '&stars=' + stars;
  }

  render();
};
</script>
</body>
</html>
