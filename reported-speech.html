<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Debate Stage — Reported Speech</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0D0F1A;--surface:#13162A;--surface2:#1A1F36;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);--text:#E8EAF6;--muted:rgba(232,234,246,0.45);--accent:#E8A020;--accent2:#F5C842;--teal:#34D399;--coral:#F87171;--radius:18px;--radius-sm:10px}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 80% 50% at 20% -10%,rgba(232,160,32,.12) 0%,transparent 60%),radial-gradient(ellipse 60% 40% at 80% 100%,rgba(52,211,153,.07) 0%,transparent 55%)}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 56px;position:relative;z-index:1}
.hdr{text-align:center;padding:28px 0 20px}
.hdr-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(232,160,32,.12);border:1px solid rgba(232,160,32,.3);border-radius:99px;padding:5px 14px;margin-bottom:14px;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--accent2)}
.hdr-logo{width:70px;height:70px;background:linear-gradient(135deg,var(--accent),#D97706);border-radius:24px;display:inline-flex;align-items:center;justify-content:center;font-size:34px;margin-bottom:12px;box-shadow:0 8px 32px rgba(232,160,32,.35);animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1deg)}}
.hdr-title{font-family:'Instrument Serif',serif;font-size:clamp(26px,6vw,42px);font-weight:400;color:#fff;margin-bottom:8px}
.hdr-title span{color:var(--accent2);font-style:italic}
.hdr-sub{font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:14px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent)}
.progress-row{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.progress-bar{flex:1;height:5px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .4s}
.progress-txt{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.q-num{font-size:11px;font-weight:700;color:var(--accent2);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.direct-speech{background:var(--surface2);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:14px 16px;font-family:'Instrument Serif',serif;font-size:17px;color:#fff;margin-bottom:16px;font-style:italic}
.q-label{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:12px}
.mcq-opts{display:flex;flex-direction:column;gap:8px}
.mcq-opt{background:var(--surface2);border:1.5px solid var(--border2);border-radius:11px;padding:12px 16px;font-size:14px;font-weight:600;color:var(--text);cursor:pointer;transition:all .2s;font-family:inherit;text-align:left}
.mcq-opt:hover{border-color:var(--accent);background:rgba(232,160,32,.1);color:#fff}
.mcq-opt.correct{border-color:var(--teal);background:rgba(52,211,153,.15);color:var(--teal)}
.mcq-opt.wrong{border-color:var(--coral);background:rgba(248,113,113,.12);color:var(--coral)}
.hint-box{display:none;margin-top:12px;padding:11px 14px;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.25);border-radius:10px;font-size:13px;color:#FBBF24;font-weight:600}
.hint-box.show{display:block}
.feedback{display:none;margin-top:12px;padding:11px 14px;border-radius:10px;font-size:13px;font-weight:600;align-items:center;gap:8px}
.feedback.show{display:flex}
.feedback.ok{background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.3);color:var(--teal)}
.feedback.bad{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);color:var(--coral)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:11px;padding:12px 22px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,var(--accent),#D97706);color:#fff;box-shadow:0 4px 18px rgba(232,160,32,.35)}
.btn-primary:hover{transform:translateY(-2px)}
.btn-success{background:linear-gradient(135deg,#10B981,#059669);color:#fff;box-shadow:0 4px 18px rgba(16,185,129,.4)}
.btn-success:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn-success:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-outline{background:transparent;border:1.5px solid var(--border2);color:var(--muted)}
.btn-outline:hover{border-color:var(--accent2);color:var(--accent2)}
.btn-ghost{background:rgba(255,255,255,.06);border:1px solid var(--border2);color:var(--text)}
.btn-row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.stat-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.stat{flex:1;min-width:75px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 14px;text-align:center}
.stat-val{font-family:'Instrument Serif',serif;font-size:26px;color:#fff}
.stat-lbl{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-top:2px}
.result-screen{display:none;text-align:center;padding:32px 0}
.result-screen.show{display:block}
.result-emoji{font-size:60px;margin-bottom:14px;animation:popIn .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{transform:scale(0)}to{transform:scale(1)}}
.result-title{font-family:'Instrument Serif',serif;font-size:34px;color:#fff;margin-bottom:6px}
.result-sub{font-size:13px;color:var(--muted);margin-bottom:22px}
.submit-note{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3);border-radius:11px;padding:12px 16px;font-size:13px;color:var(--teal);font-weight:600;margin-bottom:16px;text-align:center}

.game-topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(13,15,26,.92);backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,.08);
  padding:8px 16px;display:flex;align-items:center;justify-content:space-between;
  margin-bottom:0;
}
.gtb-left{display:flex;align-items:center;gap:10px}
.gtb-title{font-family:'Instrument Serif',serif;font-size:16px;color:#fff}
.btn-island-return{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(0,212,190,.15);border:1px solid rgba(0,212,190,.35);
  color:#00d4be;font-size:12px;font-weight:800;
  border-radius:10px;padding:6px 14px;cursor:pointer;
  font-family:'Nunito',sans-serif;transition:all .15s;text-decoration:none;
}
.btn-island-return:hover{background:rgba(0,212,190,.25);color:#fff}

/* ── HERO BAR ── */
#heroBar{
  background:var(--surface);border-bottom:1px solid rgba(255,255,255,0.1);
  padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  position:relative;z-index:10;
}
.hero-badge{background:rgba(52,211,153,0.1);border:1px solid rgba(52,211,153,0.3);
  border-radius:99px;padding:5px 14px;font-size:11px;font-weight:600;color:#34D399}
.hero-name{font-size:13px;font-weight:700;color:#E8EAF6}
.hero-cls{font-size:10px;color:rgba(232,234,246,0.45);font-weight:500;margin-top:1px}
.btn-back-island{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  color:rgba(255,255,255,.5);font-size:11px;font-weight:700;border-radius:8px;
  padding:5px 12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.btn-back-island:hover{background:rgba(255,255,255,.13);color:#fff}
</style>
</head>
<body>
<!-- ── HERO BAR — shows logged-in student ── -->
<div id="heroBar"></div>

<div class="game-topbar">
  <div class="gtb-left">
    <span style="font-size:20px">🏝️</span>
    <span class="gtb-title">English Island</span>
  </div>
  <button class="btn-island-return" onclick="goBack()">🏝️ Return to Island</button>
</div>
<div class="wrap">
  <div class="hdr">
    <div class="hdr-badge">🏛️ Debate Stage</div>
    <div class="hdr-logo">💬</div>
    <h1 class="hdr-title">Reported <span>Speech</span></h1>
    <p class="hdr-sub" id="heroLabel">Choose the correct reported speech</p>
  </div>

  <div class="card" id="quizCard">
    <div class="progress-row">
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:10%"></div></div>
      <div class="progress-txt" id="progressTxt">1 / 10</div>
    </div>
    <div class="q-num" id="qNum">Question 1 of 10</div>
    <div class="direct-speech" id="directSpeech"></div>
    <div class="q-label">Choose the correct reported speech:</div>
    <div class="mcq-opts" id="mcqOpts"></div>
    <div class="hint-box" id="hintBox"></div>
    <div class="feedback" id="feedback"></div>
    <div class="btn-row">
      <button class="btn btn-outline" onclick="showHint()">💡 Hint</button>
      <button class="btn btn-ghost" onclick="goBack()">← Back</button>
    </div>
  </div>

  <div class="result-screen" id="resultScreen">
    <div class="result-emoji" id="resultEmoji">🌟</div>
    <div class="result-title" id="resultTitle">Well Done!</div>
    <div class="result-sub" id="resultSub"></div>
    <div class="stat-row" style="max-width:300px;margin:0 auto 16px">
      <div class="stat"><div class="stat-val" id="rScore">0</div><div class="stat-lbl">Correct</div></div>
      <div class="stat"><div class="stat-val" id="rStars">0</div><div class="stat-lbl">Stars</div></div>
      <div class="stat"><div class="stat-val" id="rPts">0</div><div class="stat-lbl">Points</div></div>
    </div>
    <div class="submit-note">✅ Done! Click below to save your score and return to the island.</div>
    <div class="btn-row" style="justify-content:center;flex-direction:column;align-items:center;gap:10px">
      <button class="btn btn-success" id="submitBtn" onclick="doSubmit()">📤 Submit Score & Return to Island</button>
      <button class="btn btn-ghost" onclick="restart()">↩ Try Again</button>
      <button class="btn btn-island-return" style="padding:12px 22px;font-size:14px" onclick="goBack()">🏝️ Back to Island</button>
    </div>
  </div>
</div>

<script>

function fbKey(s){ return (s||'').replace(/[.#$\[\]\/]/g,'_'); }

async function fbSaveScore(name,cls,zone,topic,score,total,stars){
  if(!name||!window._fbDb) return;
  try{
    await window._fbDb.ref('scores/'+fbKey(name)).update({
      name, cls,
      ['zone_'+zone]:{score,total,stars,pts:score*10,topic,ts:Date.now()}
    });
  }catch(e){console.warn('Firebase save error:',e);}
}

</script>
<script>
const urlP=new URLSearchParams(location.search);
const _stored=(function(){try{return JSON.parse(sessionStorage.getItem('student')||'{}');}catch(e){return {};}})();
const hero={name:urlP.get('hero')||_stored.name||'',cls:urlP.get('cls')||_stored.cls||'',returnTo:urlP.get('returnTo')||'student-portal.html'};

// ── Render hero bar ──
(function(){
  const bar = document.getElementById('heroBar');
  if(!bar) return;
  if(hero.name){
    bar.innerHTML =
      '<div class="hero-badge">\u2713 Logged in</div>' +
      '<div>' +
        '<div class="hero-name">' + hero.name + '</div>' +
        '<div class="hero-cls">' + hero.cls + '</div>' +
      '</div>' +
      '<div style="margin-left:auto;font-size:10px;color:rgba(232,234,246,.45);letter-spacing:.5px">Scores auto-save on completion</div>' +
      '<button class="btn-back-island" onclick="goBack()">← Island</button>';
  } else {
    bar.innerHTML =
      '<div style="font-size:12px;color:#FBBF24;font-weight:700">\u26a0\ufe0f Not logged in \u2014 go back to the portal to log in first.</div>' +
      '<button class="btn-back-island" onclick="window.location.href=hero.returnTo">← Island</button>';
  }
})();



const QUESTIONS=[
  {direct:'"I am going to the library," Ahmad said.',opts:['Ahmad said that he was going to the library.','Ahmad said that he is going to the library.','Ahmad said that I was going to the library.','Ahmad said he will go to the library.'],answer:0,hint:'Change "am" → "was", "I" → "he".'},
  {direct:'"We have finished our homework," Priya told her mother.',opts:['Priya told her mother that they had finished their homework.','Priya told her mother that we have finished our homework.','Priya told her mother that they have finished their homework.','Priya told her mother that she had finished her homework.'],answer:0,hint:'"have finished" → "had finished". "We" → "they".'},
  {direct:'"You must submit your work tomorrow," the teacher told the students.',opts:['The teacher told the students that they must submit their work the next day.','The teacher told the students that you must submit your work tomorrow.','The teacher told the students that they had to submit their work the next day.','The teacher told the students that they should submit their work tomorrow.'],answer:2,hint:'"must" → "had to", "tomorrow" → "the next day".'},
  {direct:'"I will help you with the project," Mei said to Ravi.',opts:['Mei told Ravi that she will help him with the project.','Mei told Ravi that she would help him with the project.','Mei said to Ravi that she would help you with the project.','Mei told Ravi that I would help you with the project.'],answer:1,hint:'"will" → "would", "you" → "him".'},
  {direct:'"We are going to Sentosa this weekend," Father said.',opts:['Father said that we are going to Sentosa that weekend.','Father said that they were going to Sentosa this weekend.','Father said that they were going to Sentosa that weekend.','Father said that we were going to Sentosa the next weekend.'],answer:2,hint:'"are going" → "were going", "this weekend" → "that weekend".'},
  {direct:'"You have done very well," Mrs Tan told the class.',opts:['Mrs Tan told the class that you have done very well.','Mrs Tan told the class that they had done very well.','Mrs Tan told the class that they have done very well.','Mrs Tan told the class that we had done very well.'],answer:1,hint:'"have done" → "had done", "you" → "they".'},
  {direct:'"I cannot find my pencil case," David said.',opts:['David said that he cannot find his pencil case.','David said that he could not find my pencil case.','David said that he could not find his pencil case.','David said that I could not find his pencil case.'],answer:2,hint:'"cannot" → "could not", "my" → "his".'},
  {direct:'"Do not stay up too late," Mother told me.',opts:['Mother told me to not stay up too late.','Mother told me that do not stay up too late.','Mother told me not to stay up too late.','Mother said to me that I should not stay up too late.'],answer:2,hint:'Commands: "told + person + (not) to + verb".'},
  {direct:'"Can I borrow your eraser?" Kevin asked Siti.',opts:['Kevin asked Siti if he can borrow her eraser.','Kevin asked Siti could he borrow her eraser.','Kevin asked Siti whether he could borrow her eraser.','Kevin asked Siti that he could borrow her eraser.'],answer:2,hint:'Questions: "asked + if/whether + subject + could".'},
  {direct:'"The school will hold a sports day next Friday," the principal announced.',opts:['The principal announced that the school would hold a sports day the following Friday.','The principal announced that the school will hold a sports day next Friday.','The principal announced that the school would hold a sports day next Friday.','The principal announced that they will hold a sports day the following Friday.'],answer:0,hint:'"will" → "would", "next Friday" → "the following Friday".'}
];

let qi=0,score=0,answered=false,submitted=false;

function renderQ(){
  const q=QUESTIONS[qi];
  document.getElementById('progressFill').style.width=((qi+1)/QUESTIONS.length*100)+'%';
  document.getElementById('progressTxt').textContent=(qi+1)+' / '+QUESTIONS.length;
  document.getElementById('qNum').textContent='Question '+(qi+1)+' of '+QUESTIONS.length;
  document.getElementById('directSpeech').textContent=q.direct;
  document.getElementById('hintBox').className='hint-box';
  document.getElementById('feedback').className='feedback';
  answered=false;
  const optsEl=document.getElementById('mcqOpts');
  optsEl.innerHTML=q.opts.map((o,i)=>
    `<button class="mcq-opt" onclick="pickOpt(${i},this)">${String.fromCharCode(65+i)}. ${o}</button>`
  ).join('');
}

function pickOpt(i,btn){
  if(answered)return;
  answered=true;
  const q=QUESTIONS[qi];
  const opts=document.querySelectorAll('.mcq-opt');
  opts.forEach(o=>o.style.pointerEvents='none');
  if(i===q.answer){
    score++;btn.classList.add('correct');
    const fb=document.getElementById('feedback');fb.className='feedback show ok';fb.textContent='✅ Correct!';
  } else {
    btn.classList.add('wrong');opts[q.answer].classList.add('correct');
    const fb=document.getElementById('feedback');fb.className='feedback show bad';fb.textContent='❌ Not quite. The correct answer is highlighted.';
  }
  setTimeout(()=>{
    if(qi<QUESTIONS.length-1){qi++;renderQ();}else showResult();
  },1400);
}

function showHint(){const h=document.getElementById('hintBox');h.textContent='💡 '+QUESTIONS[qi].hint;h.classList.add('show')}

function showResult(){
  const total=QUESTIONS.length,pct=Math.round(score/total*100);
  const stars=pct>=90?3:pct>=70?2:pct>=50?1:0;
  document.getElementById('quizCard').style.display='none';
  document.getElementById('resultScreen').classList.add('show');
  document.getElementById('resultEmoji').textContent=stars===3?'🏆':stars===2?'🌟':stars===1?'⭐':'💪';
  document.getElementById('resultTitle').textContent=stars===3?'Perfect!':stars===2?'Great Work!':stars===1?'Good Try!':'Keep Practising!';
  document.getElementById('resultSub').textContent='You got '+score+'/'+total+' correct';
  document.getElementById('rScore').textContent=score;
  document.getElementById('rStars').textContent=stars;
  document.getElementById('rPts').textContent='+'+(score*10);
}

async function doSubmit(){
  if(submitted)return;
  const btn=document.getElementById('submitBtn');
  btn.disabled=true;btn.textContent='⏳ Submitting...';
  submitted=true;
  const total=QUESTIONS.length,pct=Math.round(score/total*100);
  const stars=pct>=90?3:pct>=70?2:pct>=50?1:0;
  await fbSaveScore(hero.name,hero.cls,'rs','Reported Speech',score,total,stars);
  const ret=hero.returnTo
    +'?hero='+encodeURIComponent(hero.name)
    +'&cls='+encodeURIComponent(hero.cls)
    +'&zone=rs&score='+score+'&total='+total+'&stars='+stars;
  window.location.href=ret;
}

function restart(){qi=0;score=0;answered=false;submitted=false;document.getElementById('quizCard').style.display='block';document.getElementById('resultScreen').classList.remove('show');renderQ()}
function goBack(){window.location.href=hero.returnTo+'?hero='+encodeURIComponent(hero.name)+'&cls='+encodeURIComponent(hero.cls)}

renderQ();
</script>
