<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library Tower — Grammar Cloze</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0D0F1A;--surface:#13162A;--surface2:#1A1F36;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);--text:#E8EAF6;--muted:rgba(232,234,246,0.45);--accent:#4A90D9;--accent2:#7BB8F0;--teal:#34D399;--coral:#F87171;--gold:#FBBF24;--radius:18px;--radius-sm:10px}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 80% 50% at 20% -10%,rgba(74,144,217,.15) 0%,transparent 60%),radial-gradient(ellipse 60% 40% at 80% 100%,rgba(52,211,153,.08) 0%,transparent 55%)}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 56px;position:relative;z-index:1}
.hdr{text-align:center;padding:28px 0 20px}
.hdr-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(74,144,217,.12);border:1px solid rgba(74,144,217,.3);border-radius:99px;padding:5px 14px;margin-bottom:14px;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--accent2)}
.hdr-logo{width:70px;height:70px;background:linear-gradient(135deg,var(--accent),var(--teal));border-radius:24px;display:inline-flex;align-items:center;justify-content:center;font-size:34px;margin-bottom:12px;box-shadow:0 8px 32px rgba(74,144,217,.35);animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1deg)}}
.hdr-title{font-family:'Instrument Serif',serif;font-size:clamp(26px,6vw,42px);font-weight:400;color:#fff;margin-bottom:8px}
.hdr-title span{color:var(--accent2);font-style:italic}
.hdr-sub{font-size:13px;color:var(--muted);font-weight:500}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:14px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent)}
.card-title{font-family:'Instrument Serif',serif;font-size:17px;color:#fff;margin-bottom:14px;display:flex;align-items:center;gap:9px}
.card-icon{width:34px;height:34px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;background:rgba(74,144,217,.15);flex-shrink:0}
.progress-row{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.progress-bar{flex:1;height:5px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--teal));border-radius:99px;transition:width .4s ease}
.progress-txt{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.passage{font-size:15px;line-height:2.4;color:var(--text);background:var(--surface2);border-radius:var(--radius-sm);padding:18px;border:1px solid var(--border)}
.blank-wrap{display:inline-flex;align-items:center;position:relative;margin:0 2px}
.blank{display:inline-block;min-width:88px;height:30px;border-bottom:2px solid var(--accent);background:rgba(74,144,217,.08);border-radius:6px 6px 0 0;padding:0 8px;font-size:13px;font-weight:600;color:#fff;text-align:center;line-height:30px;cursor:pointer;transition:all .2s;position:relative}
.blank:hover{background:rgba(74,144,217,.18)}
.blank.answered{border-bottom-color:var(--teal);background:rgba(52,211,153,.12);color:var(--teal)}
.blank.wrong{border-bottom-color:var(--coral);background:rgba(248,113,113,.12);color:var(--coral);animation:shake .3s ease}
.blank-num{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;font-size:9px;font-weight:700;width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.options-area{margin-top:18px}
.options-label{font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.options-grid{display:flex;flex-wrap:wrap;gap:7px}
.opt-btn{background:var(--surface2);border:1px solid var(--border2);border-radius:9px;padding:7px 16px;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;transition:all .2s;font-family:inherit}
.opt-btn:hover{background:rgba(74,144,217,.15);border-color:var(--accent);color:#fff}
.opt-btn.used{opacity:.3;pointer-events:none;text-decoration:line-through}
.feedback{margin-top:14px;padding:12px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;display:none;align-items:center;gap:9px}
.feedback.show{display:flex}
.feedback.ok{background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.3);color:var(--teal)}
.feedback.bad{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);color:var(--coral)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:11px;padding:12px 24px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,var(--accent),#2563EB);color:#fff;box-shadow:0 4px 18px rgba(74,144,217,.35)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 26px rgba(74,144,217,.45)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-success{background:linear-gradient(135deg,#10B981,#059669);color:#fff;box-shadow:0 4px 18px rgba(16,185,129,.4)}
.btn-success:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn-ghost{background:rgba(255,255,255,.06);border:1px solid var(--border2);color:var(--text)}
.btn-ghost:hover{background:rgba(255,255,255,.1)}
.btn-row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.stat-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.stat{flex:1;min-width:75px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 14px;text-align:center}
.stat-val{font-family:'Instrument Serif',serif;font-size:26px;color:#fff}
.stat-lbl{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-top:2px}
.result-screen{display:none;text-align:center;padding:32px 0}
.result-screen.show{display:block}
.result-emoji{font-size:60px;margin-bottom:14px;animation:popIn .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{transform:scale(0)}to{transform:scale(1)}}
.result-title{font-family:'Instrument Serif',serif;font-size:34px;color:#fff;margin-bottom:6px}
.result-sub{font-size:13px;color:var(--muted);margin-bottom:22px}
.submit-note{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3);border-radius:11px;padding:12px 16px;font-size:13px;color:var(--teal);font-weight:600;margin-bottom:16px;text-align:center}
.set-tabs{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
.set-tab{padding:5px 13px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--border2);background:var(--surface2);color:var(--muted);cursor:pointer;transition:all .2s;font-family:inherit}
.set-tab.active{background:rgba(74,144,217,.2);border-color:var(--accent);color:var(--accent2)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:#1e2340;border:1px solid var(--border2);border-radius:11px;padding:11px 22px;font-size:13px;font-weight:600;color:var(--text);transition:transform .3s ease;z-index:999;pointer-events:none;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}

.game-topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(13,15,26,.92);backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,.08);
  padding:8px 16px;display:flex;align-items:center;justify-content:space-between;
  margin-bottom:0;
}
.gtb-left{display:flex;align-items:center;gap:10px}
.gtb-title{font-family:'Instrument Serif',serif;font-size:16px;color:#fff}
.btn-island-return{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(0,212,190,.15);border:1px solid rgba(0,212,190,.35);
  color:#00d4be;font-size:12px;font-weight:800;
  border-radius:10px;padding:6px 14px;cursor:pointer;
  font-family:'Nunito',sans-serif;transition:all .15s;text-decoration:none;
}
.btn-island-return:hover{background:rgba(0,212,190,.25);color:#fff}

/* ── HERO BAR ── */
#heroBar{
  background:var(--surface);border-bottom:1px solid rgba(255,255,255,0.1);
  padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  position:relative;z-index:10;
}
.hero-badge{background:rgba(52,211,153,0.1);border:1px solid rgba(52,211,153,0.3);
  border-radius:99px;padding:5px 14px;font-size:11px;font-weight:600;color:#34D399}
.hero-name{font-size:13px;font-weight:700;color:#E8EAF6}
.hero-cls{font-size:10px;color:rgba(232,234,246,0.45);font-weight:500;margin-top:1px}
.btn-back-island{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  color:rgba(255,255,255,.5);font-size:11px;font-weight:700;border-radius:8px;
  padding:5px 12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.btn-back-island:hover{background:rgba(255,255,255,.13);color:#fff}
</style>
</head>
<body>
<!-- ── HERO BAR — shows logged-in student ── -->
<div id="heroBar"></div>

<div class="game-topbar">
  <div class="gtb-left">
    <span style="font-size:20px">🏝️</span>
    <span class="gtb-title">English Island</span>
  </div>
  <button class="btn-island-return" onclick="goBack()">🏝️ Return to Island</button>
</div>
<div class="wrap">
  <div class="hdr">
    <div class="hdr-badge">📖 Library Tower</div>
    <div class="hdr-logo">📖</div>
    <h1 class="hdr-title">Grammar <span>Cloze</span></h1>
    <p class="hdr-sub" id="heroLabel">Fill in the blanks with the correct words</p>
  </div>

  <div class="card" style="animation-delay:.1s">
    <div class="card-title"><div class="card-icon">📜</div>Choose a Passage</div>
    <div class="set-tabs" id="setTabs"></div>
  </div>

  <div class="card" id="quizCard" style="display:none">
    <div class="progress-row">
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="progress-txt" id="progressTxt">0 / 0</div>
    </div>
    <div class="card-title"><div class="card-icon">✏️</div><span id="passageTitle">Passage</span></div>
    <div class="passage" id="passageText"></div>
    <div class="options-area">
      <div class="options-label">Word Bank — tap a blank first, then pick a word</div>
      <div class="options-grid" id="optionsGrid"></div>
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="goBack()">← Back</button>
    </div>
  </div>

  <div class="result-screen" id="resultScreen">
    <div class="result-emoji" id="resultEmoji">🌟</div>
    <div class="result-title" id="resultTitle">Well Done!</div>
    <div class="result-sub" id="resultSub"></div>
    <div class="stat-row" style="max-width:300px;margin:0 auto 16px">
      <div class="stat"><div class="stat-val" id="rScore">0</div><div class="stat-lbl">Correct</div></div>
      <div class="stat"><div class="stat-val" id="rStars">0</div><div class="stat-lbl">Stars</div></div>
      <div class="stat"><div class="stat-val" id="rPts">0</div><div class="stat-lbl">Points</div></div>
    </div>
    <div class="submit-note" id="submitNote">✅ Ready to submit! Click below to save your score.</div>
    <div class="btn-row" style="justify-content:center;flex-direction:column;align-items:center;gap:10px">
      <button class="btn btn-success" id="submitBtn" onclick="doSubmit()">📤 Submit Score & Return to Island</button>
      <button class="btn btn-ghost" onclick="restart()">↩ Try Again</button>
      <button class="btn btn-island-return" style="padding:12px 22px;font-size:14px" onclick="goBack()">🏝️ Back to Island</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>

function fbKey(s){ return (s||'').replace(/[.#$\[\]\/]/g,'_'); }

async function fbSaveScore(name,cls,zone,topic,score,total,stars){
  if(!name||!window._fbDb) return;
  try{
    await window._fbDb.ref('scores/'+fbKey(name)).update({
      name, cls,
      ['zone_'+zone]:{score,total,stars,pts:score*10,topic,ts:Date.now()}
    });
  }catch(e){console.warn('Firebase save error:',e);}
}

</script>
<script>
const urlP=new URLSearchParams(location.search);
const _stored=(function(){try{return JSON.parse(sessionStorage.getItem('student')||'{}');}catch(e){return {};}})();
const hero={name:urlP.get('hero')||_stored.name||'',cls:urlP.get('cls')||_stored.cls||'',returnTo:urlP.get('returnTo')||'student-portal.html'};

// ── Render hero bar ──
(function(){
  const bar = document.getElementById('heroBar');
  if(!bar) return;
  if(hero.name){
    bar.innerHTML =
      '<div class="hero-badge">\u2713 Logged in</div>' +
      '<div>' +
        '<div class="hero-name">' + hero.name + '</div>' +
        '<div class="hero-cls">' + hero.cls + '</div>' +
      '</div>' +
      '<div style="margin-left:auto;font-size:10px;color:rgba(232,234,246,.45);letter-spacing:.5px">Scores auto-save on completion</div>' +
      '<button class="btn-back-island" onclick="goBack()">← Island</button>';
  } else {
    bar.innerHTML =
      '<div style="font-size:12px;color:#FBBF24;font-weight:700">\u26a0\ufe0f Not logged in \u2014 go back to the portal to log in first.</div>' +
      '<button class="btn-back-island" onclick="window.location.href=hero.returnTo">← Island</button>';
  }
})();




const PASSAGES=[
  {id:'gc1',title:'The Lost Kite',
   text:'Yesterday, Ahmad _1_ flying his kite in the park when a strong wind _2_ it away. He _3_ after it as fast as he could, but the kite _4_ already landed in a tall tree. Ahmad _5_ for help and a kind man used a long pole _6_ the kite down.',
   blanks:[1,2,3,4,5,6],answers:['was','blew','ran','had','called','to get'],
   options:['was','blew','ran','had','called','to get','has','throw','is','went']},
  {id:'gc2',title:'A Rainy Day',
   text:'It _1_ raining heavily when school ended. Priya _2_ her umbrella at home and _3_ know what to do. Her friend Mei _4_ her umbrella _5_ them. By the time they _6_ home, their shoes were completely wet.',
   blanks:[1,2,3,4,5,6],answers:['was','had left','did not','shared','with','reached'],
   options:['was','had left','did not','shared','with','reached','is','forgot','could','gives','for','arrived']},
  {id:'gc3',title:'The Science Project',
   text:'The students _1_ excited because they _2_ just finished their science project. Mrs Tan _3_ them that their model volcano _4_ the best in the class. They _5_ worked very hard _6_ two weeks.',
   blanks:[1,2,3,4,5,6],answers:['were','had','told','was','had','for'],
   options:['were','had','told','was','had','for','are','have','said','is','has','since']},
  {id:'gc4',title:'A Visit to the Zoo',
   text:'Last Saturday, our family _1_ to the zoo. We _2_ there for three hours. My little sister _3_ never seen a giraffe before, so she _4_ very surprised. Dad _5_ us ice cream after _6_ all the animals.',
   blanks:[1,2,3,4,5,6],answers:['went','stayed','had','was','bought','seeing'],
   options:['went','stayed','had','was','bought','seeing','goes','spend','has','were','buys','see']},
  {id:'gc5',title:'The Helpful Neighbour',
   text:'Mr Lim, _1_ lives next door, is very kind. Last week, he _2_ my mother carry her heavy bags _3_ the stairs. He also _4_ our cat _5_ it was lost. We are _6_ grateful for his help.',
   blanks:[1,2,3,4,5,6],answers:['who','helped','up','found','when','always'],
   options:['who','helped','up','found','when','always','which','help','down','sees','while','very']}
];

let currentPassage=null,selectedBlank=null,answers={},score=0,finalPts=0,submitted=false;

// Build tabs
const tabsEl=document.getElementById('setTabs');
PASSAGES.forEach((p,i)=>{
  const btn=document.createElement('button');
  btn.className='set-tab'+(i===0?' active':'');
  btn.textContent=p.title;
  btn.onclick=()=>loadPassage(p,btn);
  tabsEl.appendChild(btn);
});
loadPassage(PASSAGES[0],tabsEl.children[0]);

function loadPassage(p,tabBtn){
  currentPassage=p;selectedBlank=null;answers={};score=0;submitted=false;
  document.querySelectorAll('.set-tab').forEach(t=>t.classList.remove('active'));
  if(tabBtn)tabBtn.classList.add('active');
  document.getElementById('quizCard').style.display='block';
  document.getElementById('resultScreen').classList.remove('show');
  document.getElementById('passageTitle').textContent=p.title;
  renderPassage();renderOptions();updateProgress();
}

function renderPassage(){
  const p=currentPassage;
  let html=p.text;
  p.blanks.forEach((n,i)=>{
    const val=answers[n]?`<span style="font-size:12px">${answers[n]}</span>`:'';
    const cls=answers[n]?(answers[n]===p.answers[i]?'answered':'wrong'):(selectedBlank===n?'selected':'');
    html=html.replace('_'+n+'_',
      `<span class="blank-wrap"><span class="blank ${cls}" data-blank="${n}" onclick="selectBlank(${n})"><span class="blank-num">${n}</span>${val||'&nbsp;&nbsp;&nbsp;'}</span></span>`);
  });
  document.getElementById('passageText').innerHTML=html;
}

function renderOptions(){
  const grid=document.getElementById('optionsGrid');
  grid.innerHTML='';
  currentPassage.options.forEach(opt=>{
    const usedCorrectly=currentPassage.blanks.some((n,i)=>answers[n]===opt&&currentPassage.answers[i]===opt);
    const btn=document.createElement('button');
    btn.className='opt-btn'+(usedCorrectly?' used':'');
    btn.textContent=opt;btn.dataset.opt=opt;
    btn.onclick=()=>chooseOption(opt,btn);
    grid.appendChild(btn);
  });
}

function selectBlank(n){
  if(answers[n]&&answers[n]===currentPassage.answers[currentPassage.blanks.indexOf(n)])return;
  selectedBlank=n;renderPassage();
  showToast('Blank '+n+' selected — pick a word below');
}

function chooseOption(opt,btn){
  if(!selectedBlank){showToast('Tap a blank first!');return}
  const n=selectedBlank;
  const idx=currentPassage.blanks.indexOf(n);
  const correct=currentPassage.answers[idx];
  answers[n]=opt;selectedBlank=null;renderPassage();
  if(opt===correct){
    score++;showFeedback(true,'✅ Correct! "'+opt+'" is right.');btn.classList.add('used');
  } else {
    showFeedback(false,'❌ Not quite. Try again for blank '+n+'.');
    delete answers[n];
    setTimeout(()=>{renderPassage();hideFeedback()},1200);
  }
  updateProgress();
  const allCorrect=currentPassage.blanks.every((n,i)=>answers[n]===currentPassage.answers[i]);
  if(allCorrect)setTimeout(()=>showResult(),700);
}

function updateProgress(){
  const done=Object.keys(answers).length,total=currentPassage.blanks.length;
  document.getElementById('progressFill').style.width=(done/total*100)+'%';
  document.getElementById('progressTxt').textContent=done+' / '+total;
}

function showFeedback(ok,msg){const el=document.getElementById('feedback');el.className='feedback show '+(ok?'ok':'bad');el.textContent=msg}
function hideFeedback(){document.getElementById('feedback').className='feedback'}

function showResult(){
  const total=currentPassage.blanks.length;
  const pct=Math.round(score/total*100);
  const stars=pct>=90?3:pct>=70?2:pct>=50?1:0;
  finalPts=score*10;
  document.getElementById('quizCard').style.display='none';
  document.getElementById('resultScreen').classList.add('show');
  document.getElementById('resultEmoji').textContent=stars===3?'🏆':stars===2?'🌟':stars===1?'⭐':'💪';
  document.getElementById('resultTitle').textContent=stars===3?'Perfect!':stars===2?'Great Work!':stars===1?'Good Try!':'Keep Practising!';
  document.getElementById('resultSub').textContent='You got '+score+'/'+total+' correct on "'+currentPassage.title+'"';
  document.getElementById('rScore').textContent=score;
  document.getElementById('rStars').textContent=stars;
  document.getElementById('rPts').textContent='+'+finalPts;
  document.getElementById('submitNote').textContent='✅ Ready to submit! Click below to save your score and return.';
  document.getElementById('submitBtn').disabled=false;
}

async function doSubmit(){
  if(submitted)return;
  const btn=document.getElementById('submitBtn');
  btn.disabled=true;btn.textContent='⏳ Submitting...';
  submitted=true;
  const total=currentPassage.blanks.length;
  const pct=Math.round(score/total*100);
  const stars=pct>=90?3:pct>=70?2:pct>=50?1:0;

  await fbSaveScore(hero.name,hero.cls,'gc',currentPassage.title,score,total,stars);

  // Return to portal with score params
  const ret=hero.returnTo
    +'?hero='+encodeURIComponent(hero.name)
    +'&cls='+encodeURIComponent(hero.cls)
    +'&zone=gc'
    +'&score='+score
    +'&total='+total
    +'&stars='+stars;
  window.location.href=ret;
}

function restart(){loadPassage(currentPassage,document.querySelector('.set-tab.active'))}
function goBack(){window.location.href=hero.returnTo+'?hero='+encodeURIComponent(hero.name)+'&cls='+encodeURIComponent(hero.cls)}

function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),2000);
