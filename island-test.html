<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Island 3D Test</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060e24;display:flex;align-items:center;justify-content:center;height:100vh}
canvas{border-radius:16px;cursor:grab;display:block}
canvas:active{cursor:grabbing}
#info{position:fixed;top:12px;left:50%;transform:translateX(-50%);color:#fff;font-family:sans-serif;font-size:13px;background:rgba(0,0,0,.5);padding:6px 14px;border-radius:20px}
</style>
</head>
<body>
<canvas id="c" width="600" height="500"></canvas>
<div id="info">🌴 Loading Island...</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
const canvas = document.getElementById('c');
const info   = document.getElementById('info');

const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(600,500);
renderer.shadowMap.enabled = true;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.FogExp2(0x87ceeb, 0.03);

const camera = new THREE.PerspectiveCamera(45, 600/500, 0.1, 200);
camera.position.set(0, 6, 10);
camera.lookAt(0, 0.5, 0);

scene.add(new THREE.AmbientLight(0xfff5e0, 0.9));
const sun = new THREE.DirectionalLight(0xfffbe8, 2.2);
sun.position.set(8,15,8); sun.castShadow=true;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0x87ceeb, 0x4a8f3a, 0.7));

const water = new THREE.Mesh(
  new THREE.CircleGeometry(14,64),
  new THREE.MeshStandardMaterial({color:0x29a8d8,roughness:0.05,metalness:0.3,transparent:true,opacity:0.82})
);
water.rotation.x = -Math.PI/2; water.position.y = -0.8;
scene.add(water);

const root = new THREE.Group();
scene.add(root);

const loader = new THREE.GLTFLoader();
loader.load(
  'Island_model-compressed.glb',
  function(gltf){
    const model = gltf.scene;
    const box  = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const sc   = 5.0 / Math.max(size.x,size.y,size.z);
    model.scale.setScalar(sc);
    model.position.sub(box.getCenter(new THREE.Vector3()).multiplyScalar(sc));
    const box2 = new THREE.Box3().setFromObject(model);
    model.position.y -= box2.min.y - 0.1;
    model.traverse(c=>{ if(c.isMesh){c.castShadow=c.receiveShadow=true;} });
    root.add(model);
    info.textContent = '✅ Island loaded! Drag to rotate.';
    setTimeout(()=>info.style.display='none', 2000);
  },
  xhr => { info.textContent = '🌴 Loading... '+Math.round(xhr.loaded/xhr.total*100)+'%'; },
  err => { console.error(err); info.textContent = '❌ Error: '+err; }
);

let dragging=false,lastX=0,velY=0,rotY=0,t=0;
canvas.addEventListener('mousedown',e=>{dragging=true;velY=0;lastX=e.clientX;});
document.addEventListener('mousemove',e=>{if(!dragging)return;velY=(e.clientX-lastX)*.013;rotY+=velY;lastX=e.clientX;});
document.addEventListener('mouseup',()=>dragging=false);

(function animate(){
  requestAnimationFrame(animate); t+=0.016;
  if(!dragging){velY*=.93;rotY+=velY+.004;}
  root.rotation.y=rotY;
  root.position.y=Math.sin(t*.7)*.08;
  renderer.render(scene,camera);
})();
</script>
</body>
</html>
