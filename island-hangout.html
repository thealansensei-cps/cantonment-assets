<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Island Hangout 🏝️</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #07111f; --surface: #0e1d30; --surface2: #162640;
  --border: rgba(100,180,255,.15); --text: #ddeeff; --muted: rgba(180,210,255,.5);
  --teal: #00d4be; --gold: #ffc94a; --coral: #ff6b7a; --green: #3ddc84;
}
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Nunito', sans-serif; overflow: hidden; }

/* TOP BAR */
#topbar {
  position: fixed; top: 0; left: 0; right: 0; height: 52px; z-index: 100;
  background: rgba(7,17,31,.95); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px; padding: 0 12px;
}
#tbAvatar { width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Fredoka One',cursive;font-size:14px;color:#fff; }
#tbName { font-weight:800;font-size:14px; }
#tbCls  { font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase; }
.tb-logo { font-family:'Fredoka One',cursive;font-size:17px;color:var(--teal);margin-right:4px; }
.tb-right { margin-left:auto;display:flex;align-items:center;gap:6px; }
.online-pill { display:flex;align-items:center;gap:5px;padding:4px 10px;background:rgba(61,220,132,.1);border:1px solid rgba(61,220,132,.25);border-radius:20px;font-size:11px;font-weight:800;color:var(--green); }
.online-dot { width:7px;height:7px;border-radius:50%;background:var(--green);animation:blink 2s infinite; }
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.tb-btn { padding:5px 11px;border-radius:9px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--text);font-size:11px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif; }
.tb-btn.gold { border-color:rgba(255,201,74,.3);color:var(--gold);background:rgba(255,201,74,.07); }

/* MESSAGES */
#messages {
  position: fixed; top: 52px; left: 0; right: 0; bottom: 60px;
  overflow-y: auto; padding: 12px 12px 8px;
  display: flex; flex-direction: column; gap: 4px;
}
.sys-msg { text-align:center;font-size:11px;color:var(--muted);padding:4px 0;font-style:italic; }
.msg-row { display:flex;gap:8px;align-items:flex-end; }
.msg-row.mine { flex-direction:row-reverse; }
.msg-av { width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Fredoka One',cursive;font-size:10px;color:#fff; }
.msg-body { max-width:75%; }
.msg-meta { display:flex;gap:5px;align-items:baseline;margin-bottom:2px;font-size:10px; }
.msg-row.mine .msg-meta { flex-direction:row-reverse; }
.msg-sender { font-weight:800; }
.msg-time { color:rgba(255,255,255,.25);font-size:9px; }
.bubble { padding:7px 11px;border-radius:14px 14px 14px 3px;background:var(--surface2);border:1px solid var(--border);font-size:13px;line-height:1.4;word-break:break-word; }
.msg-row.mine .bubble { border-radius:14px 14px 3px 14px;background:#1a4a8a;border-color:rgba(100,180,255,.2); }
.bubble img { max-width:180px;max-height:140px;border-radius:8px;display:block;margin-top:3px; }

/* INPUT BAR */
#inputbar {
  position: fixed; bottom: 0; left: 0; right: 0; height: 60px;
  background: rgba(7,17,31,.97); border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 6px; padding: 0 10px;
}
.ib-btn { width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Nunito',sans-serif;font-weight:700; }
#chatInput { flex:1;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:'Nunito',sans-serif;font-size:13px;font-weight:600;padding:0 12px;outline:none; }
#chatInput::placeholder { color:var(--muted); }
#sendBtn { width:36px;height:36px;border-radius:10px;border:none;background:linear-gradient(135deg,#1a73c8,#0091ea);color:#fff;font-size:16px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center; }

/* EMOJI PANEL */
#emojiPanel { position:fixed;bottom:65px;left:10px;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px;width:280px;box-shadow:0 8px 30px rgba(0,0,0,.6);display:none; }
#emojiPanel.open { display:block; }
#emojiSearch { width:100%;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:12px;margin-bottom:8px;font-family:'Nunito',sans-serif;outline:none; }
#emojiGrid { display:grid;grid-template-columns:repeat(8,1fr);gap:2px;max-height:160px;overflow-y:auto; }
.ebtn { aspect-ratio:1;border:none;background:transparent;font-size:18px;cursor:pointer;border-radius:5px;display:flex;align-items:center;justify-content:center; }
.ebtn:hover { background:rgba(255,255,255,.1); }

/* GIF PANEL */
#gifPanel { position:fixed;bottom:65px;left:54px;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px;width:290px;box-shadow:0 8px 30px rgba(0,0,0,.6);display:none; }
#gifPanel.open { display:block; }
.gif-row { display:flex;gap:6px;margin-bottom:8px; }
#gifSearch { flex:1;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:12px;font-family:'Nunito',sans-serif;outline:none; }
.gif-go { padding:6px 12px;border-radius:8px;border:none;background:var(--teal);color:#000;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif; }
#gifGrid { display:grid;grid-template-columns:1fr 1fr;gap:4px;max-height:200px;overflow-y:auto; }
.gitem { border-radius:8px;overflow:hidden;cursor:pointer; }
.gitem img { width:100%;height:80px;object-fit:cover;display:block; }
#gifStatus { text-align:center;color:var(--muted);font-size:12px;padding:20px 0; }

/* TOAST */
#toast { position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 18px;font-size:13px;font-weight:700;z-index:300;display:none;white-space:nowrap; }

/* MODALS */
.overlay { position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:20px; }
.overlay.show { display:flex; }
.modal { background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:320px; }
.modal h2 { font-family:'Fredoka One',cursive;color:var(--gold);margin-bottom:6px;font-size:20px; }
.modal p  { color:var(--muted);font-size:12px;margin-bottom:16px; }
.modal input { width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:14px;font-family:'Nunito',sans-serif;outline:none;margin-bottom:8px;display:block; }
.modal-err { color:var(--coral);font-size:11px;font-weight:700;margin-bottom:10px;display:none; }
.modal-btns { display:flex;gap:8px;margin-top:4px; }
.btn-ok  { flex:1;padding:10px;border:none;border-radius:10px;background:var(--teal);color:#000;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;font-size:14px; }
.btn-no  { padding:10px 14px;border:1px solid var(--border);border-radius:10px;background:transparent;color:var(--muted);font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;font-size:14px; }
.btn-ban { flex:1;padding:10px;border:none;border-radius:10px;background:var(--coral);color:#fff;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;font-size:14px; }
.ban-av  { width:50px;height:50px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-family:'Fredoka One',cursive;font-size:20px;color:#fff; }

/* BANNED */
#bannedScreen { position:fixed;inset:0;z-index:500;background:#07111f;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px; }
#bannedScreen.show { display:flex; }
</style>
</head>
<body>

<div id="bannedScreen">
  <div style="font-size:60px">🚫</div>
  <div style="font-family:'Fredoka One',cursive;font-size:26px;color:var(--coral)">You've been removed</div>
  <div style="font-size:13px;color:var(--muted);text-align:center;max-width:280px;padding:0 20px">A teacher has removed you for inappropriate behaviour. Please speak to your teacher.</div>
</div>

<div id="topbar">
  <span class="tb-logo">🏝️</span>
  <div id="tbAvatar">?</div>
  <div><div id="tbName">—</div><div id="tbCls">—</div></div>
  <div class="tb-right">
    <div class="online-pill"><div class="online-dot"></div><span id="onlineCount">0</span> online</div>
    <button class="tb-btn gold" id="teacherBtn" onclick="openTeacher()">🔑 Teacher</button>
    <button class="tb-btn" onclick="goBack()">← Island</button>
  </div>
</div>

<div id="messages"></div>

<div id="inputbar">
  <button class="ib-btn" onclick="toggleEmoji()">😄</button>
  <button class="ib-btn" style="font-size:11px;font-weight:800" onclick="toggleGif()">GIF</button>
  <input id="chatInput" type="text" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendMessage()">
  <button id="sendBtn" onclick="sendMessage()">➤</button>
</div>

<div id="emojiPanel">
  <input id="emojiSearch" placeholder="Search emoji..." oninput="filterEmoji(this.value)">
  <div id="emojiGrid"></div>
</div>

<div id="gifPanel">
  <div class="gif-row">
    <input id="gifSearch" placeholder="Search GIFs..." onkeydown="if(event.key==='Enter')doGifSearch()">
    <button class="gif-go" onclick="doGifSearch()">Go</button>
  </div>
  <div id="gifStatus">Search for a GIF above 🎬</div>
  <div id="gifGrid"></div>
</div>

<div id="toast"></div>

<div class="overlay" id="teacherModal">
  <div class="modal">
    <h2>🔑 Teacher Access</h2>
    <p>Enter the teacher password to enable moderation.</p>
    <input type="password" id="teacherPw" placeholder="Password" onkeydown="if(event.key==='Enter')doTeacherLogin()">
    <div class="modal-err" id="teacherErr">Wrong password.</div>
    <div class="modal-btns">
      <button class="btn-no" onclick="closeTeacher()">Cancel</button>
      <button class="btn-ok" onclick="doTeacherLogin()">Enter</button>
    </div>
  </div>
</div>

<div class="overlay" id="banModal">
  <div class="modal" style="text-align:center">
    <div class="ban-av" id="banAv">?</div>
    <h2 id="banTitle">Remove student?</h2>
    <p id="banSub">They will be removed from Island Hangout.</p>
    <div class="modal-btns" style="margin-top:16px">
      <button class="btn-no" onclick="closeBan()">Cancel</button>
      <button class="btn-ban" onclick="doBan()">🚫 Remove</button>
    </div>
  </div>
</div>

<script>window.onload = function() {

var urlP = new URLSearchParams(location.search);
var me = {
  name:     urlP.get('hero') || '',
  cls:      urlP.get('cls')  || '',
  returnTo: urlP.get('returnTo') || 'student-portal.html'
};
if (!me.name) {
  try {
    var s = JSON.parse(localStorage.getItem('student') || sessionStorage.getItem('student') || '{}');
    me.name = s.name || 'Guest'; me.cls = s.cls || '';
  } catch(e) { me.name = 'Guest'; }
}

var CLASS_COLORS = {'4 Care':'#ff5a3c','4 Graciousness':'#3cb8ff','4 Integrity':'#ffb83c','4 Respect':'#c97fff','4 Resilience':'#3cff8a'};
var TEACHER_PW = 'cps2026';

function safeKey(n)   { return (n||'').replace(/[.#$[\]\/\s]/g,'_'); }
function shortName(n) { return (n||'').split(',')[0].trim().split(' ')[0]; }
function initials(n)  { return (n||'?').replace(/,.*/,'').trim().split(' ').slice(0,2).map(function(w){return w[0];}).join('').toUpperCase(); }
function clsColor(c)  { return CLASS_COLORS[c]||'#888'; }
function fmtTime(ts)  { var d=new Date(ts); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
function esc(s)       { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Topbar
var av = document.getElementById('tbAvatar');
av.textContent = initials(me.name);
av.style.background = clsColor(me.cls);
document.getElementById('tbName').textContent = shortName(me.name) || me.name || 'Guest';
document.getElementById('tbCls').textContent  = me.cls || '';

// Firebase
var firebaseConfig = {
  apiKey:"AIzaSyARwxGCCLctZLL64iQDlIOerRBdSf_Avfo",
  authDomain:"english-island-cps.firebaseapp.com",
  databaseURL:"https://english-island-cps-default-rtdb.firebaseio.com",
  projectId:"english-island-cps",
  storageBucket:"english-island-cps.firebasestorage.app",
  messagingSenderId:"892743482834",
  appId:"1:892743482834:web:6705bc3e3bc832cf749c0b"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
var db       = firebase.database();
var msgsRef  = db.ref('hangout_messages');
var presRef  = db.ref('hangout_presence/' + safeKey(me.name));
var bannedRef= db.ref('banned');

// Presence
if (me.name && me.name !== 'Guest') {
  presRef.set({name:me.name,cls:me.cls,ts:Date.now()});
  presRef.onDisconnect().remove();
  setInterval(function(){ presRef.update({ts:Date.now()}); }, 30000);
}
db.ref('hangout_presence').on('value', function(snap) {
  var now=Date.now(), n=0;
  snap.forEach(function(c){ var u=c.val(); if(u&&(now-u.ts)<90000) n++; });
  document.getElementById('onlineCount').textContent = n;
});

// Banned
var isTeacher=false, bannedUsers={}, pendingBan=null;
bannedRef.on('value', function(snap) {
  bannedUsers={};
  snap.forEach(function(c){ if(c.val()) bannedUsers[c.key]=true; });
  if (bannedUsers[safeKey(me.name)]) document.getElementById('bannedScreen').classList.add('show');
});

// Messages
msgsRef.limitToLast(80).on('value', function(snap) {
  var msgs=[];
  snap.forEach(function(c){ msgs.push(Object.assign({key:c.key},c.val())); });
  var el=document.getElementById('messages');
  var atBot=el.scrollHeight-el.scrollTop-el.clientHeight<100;
  var html='';
  msgs.forEach(function(m) {
    if (m.type==='system') { html+='<div class="sys-msg">'+esc(m.text)+'</div>'; return; }
    var isMine=m.sender===me.name, col=clsColor(m.senderCls);
    var content = m.gif ? '<img src="'+m.gif+'" alt="gif" loading="lazy">' : esc(m.text||'');
    html += '<div class="msg-row'+(isMine?' mine':'')+'">'+
      (!isMine?'<div class="msg-av" style="background:'+col+'">'+initials(m.sender)+'</div>':'')+
      '<div class="msg-body">'+
        '<div class="msg-meta"><span class="msg-sender" style="color:'+col+'">'+shortName(m.sender)+'</span>'+
        '<span class="msg-time">'+fmtTime(m.ts)+'</span></div>'+
        '<div class="bubble">'+content+'</div>'+
      '</div>'+
      (isMine?'<div class="msg-av" style="background:'+col+'">'+initials(m.sender)+'</div>':'')+
    '</div>';
  });
  el.innerHTML=html;
  if(atBot) el.scrollTop=el.scrollHeight;
});

// Send
function sendMessage() {
  var inp=document.getElementById('chatInput'), text=inp.value.trim();
  if (!text) return;
  if (bannedUsers[safeKey(me.name)]) { showToast('You have been removed.'); return; }
  msgsRef.push({type:'chat',sender:me.name,senderCls:me.cls,text:text,ts:Date.now()});
  inp.value=''; closeEmoji(); closeGif();
}
function sendGif(url) {
  msgsRef.push({type:'chat',sender:me.name,senderCls:me.cls,gif:url,text:'',ts:Date.now()});
  closeGif();
}

// Emoji
var EMOJIS=['😀','😃','😄','😁','😆','😅','😂','🤣','😊','😇','🥰','😍','🤩','😘','😋','😛','😜','🤪','🤑','🤗','🤔','😐','😶','😏','😒','🙄','😬','😌','😔','😢','😭','😱','😤','😡','🤬','💀','👻','🤖','💋','❤️','🧡','💛','💚','💙','💜','🖤','💯','💥','✨','🎉','🏆','🔥','⭐','🌟','🌈','☀️','🌙','⚡','❄️','🌊','🍕','🍔','🍩','🍦','🧁','🎂','☕','📚','✏️','🎵','🎶','🎸','🎮','🏀','⚽','🚀','✈️','💻','📱','🌴','🌺','🦋','🐶','🐱','🐸','🐵','👍','👎','👏','🙌','🤝','🙏','💪','✌️','🤞','👋'];
var emojiOpen=false, gifOpen=false;
(function(){
  var g=document.getElementById('emojiGrid');
  g.innerHTML=EMOJIS.map(function(e){ return '<button class="ebtn" onclick="insertEmoji(\''+e+'\')">'+e+'</button>'; }).join('');
})();

function filterEmoji(q) { document.querySelectorAll('.ebtn').forEach(function(b){ b.style.display=(!q||b.textContent.includes(q))?'':'none'; }); }
function insertEmoji(e) { var i=document.getElementById('chatInput'); i.value+=e; i.focus(); }
function toggleEmoji() { emojiOpen=!emojiOpen; gifOpen=false; document.getElementById('emojiPanel').classList.toggle('open',emojiOpen); document.getElementById('gifPanel').classList.remove('open'); }
function closeEmoji()  { emojiOpen=false; document.getElementById('emojiPanel').classList.remove('open'); }

// GIF (Giphy public beta)
function toggleGif() { gifOpen=!gifOpen; emojiOpen=false; document.getElementById('gifPanel').classList.toggle('open',gifOpen); document.getElementById('emojiPanel').classList.remove('open'); if(gifOpen&&!document.getElementById('gifGrid').children.length) loadTrending(); }
function closeGif()  { gifOpen=false; document.getElementById('gifPanel').classList.remove('open'); }
function loadTrending() {
  document.getElementById('gifStatus').textContent='Loading... 🎬';
  document.getElementById('gifStatus').style.display='block';
  document.getElementById('gifGrid').innerHTML='';
  fetch('https://api.giphy.com/v1/gifs/trending?api_key=dc6zaTOxFJmzC&limit=8&rating=g')
    .then(function(r){return r.json();}).then(function(d){renderGifs(d.data||[]);})
    .catch(function(){document.getElementById('gifStatus').textContent='Could not load GIFs 😔';});
}
function doGifSearch() {
  var q=document.getElementById('gifSearch').value.trim(); if(!q) return;
  document.getElementById('gifStatus').textContent='Searching... 🔍';
  document.getElementById('gifStatus').style.display='block';
  document.getElementById('gifGrid').innerHTML='';
  fetch('https://api.giphy.com/v1/gifs/search?api_key=dc6zaTOxFJmzC&q='+encodeURIComponent(q)+'&limit=8&rating=g')
    .then(function(r){return r.json();}).then(function(d){renderGifs(d.data||[]);})
    .catch(function(){document.getElementById('gifStatus').textContent='Search failed 😔';});
}
function renderGifs(gifs) {
  document.getElementById('gifStatus').style.display='none';
  var g=document.getElementById('gifGrid');
  if(!gifs.length){document.getElementById('gifStatus').textContent='No GIFs found 🤷';document.getElementById('gifStatus').style.display='block';return;}
  g.innerHTML=gifs.map(function(g){ var url=g.images.original.url,prev=g.images.fixed_height_small.url; return '<div class="gitem" onclick="sendGif(\''+url+'\')"><img src="'+prev+'" loading="lazy"></div>'; }).join('');
}

// Teacher
function openTeacher() { document.getElementById('teacherModal').classList.add('show'); setTimeout(function(){document.getElementById('teacherPw').focus();},100); }
function closeTeacher() { document.getElementById('teacherModal').classList.remove('show'); document.getElementById('teacherPw').value=''; document.getElementById('teacherErr').style.display='none'; }
function doTeacherLogin() {
  if(document.getElementById('teacherPw').value===TEACHER_PW){ isTeacher=true; closeTeacher(); document.getElementById('teacherBtn').textContent='✅ Teacher'; showToast('Teacher mode on 🔑'); }
  else { document.getElementById('teacherErr').style.display='block'; }
}

function initBan(name,cls) {
  if(!isTeacher){showToast('Teacher access required');return;}
  pendingBan={name:name,cls:cls};
  var banned=bannedUsers[safeKey(name)];
  var av=document.getElementById('banAv'); av.textContent=initials(name); av.style.background=clsColor(cls);
  document.getElementById('banTitle').textContent=(banned?'Unban ':'Remove ')+shortName(name)+'?';
  document.getElementById('banSub').textContent=banned?'This will restore their access.':'They will be removed immediately.';
  document.querySelector('#banModal .btn-ban').textContent=banned?'✅ Unban':'🚫 Remove';
  document.getElementById('banModal').classList.add('show');
}
function closeBan() { document.getElementById('banModal').classList.remove('show'); pendingBan=null; }
function doBan() {
  if(!pendingBan)return;
  var key=safeKey(pendingBan.name);
  if(bannedUsers[key]){ bannedRef.child(key).remove(); showToast(shortName(pendingBan.name)+' unbanned'); }
  else { bannedRef.child(key).set(true); msgsRef.push({type:'system',text:'🚫 '+shortName(pendingBan.name)+' was removed by a teacher.',ts:Date.now()}); showToast(shortName(pendingBan.name)+' removed'); }
  closeBan();
}

function goBack() {
  try{presRef.remove();}catch(e){}
  window.location.href=(me.returnTo||'student-portal.html')+'?hero='+encodeURIComponent(me.name)+'&cls='+encodeURIComponent(me.cls);
}

function showToast(msg) {
  var t=document.getElementById('toast'); t.textContent=msg; t.style.display='block';
  clearTimeout(showToast._t); showToast._t=setTimeout(function(){t.style.display='none';},2500);
}

document.addEventListener('click',function(e){
  if(!e.target.closest('#emojiPanel')&&!e.target.closest('.ib-btn'))closeEmoji();
  if(!e.target.closest('#gifPanel')&&!e.target.closest('.ib-btn'))closeGif();
});

if(me.name&&me.name!=='Guest'){
  msgsRef.push({type:'system',text:'👋 '+shortName(me.name)+' joined the hangout!',ts:Date.now()});
}


// Expose to global scope
window.safeKey = safeKey;
window.shortName = shortName;
window.initials = initials;
window.clsColor = clsColor;
window.fmtTime = fmtTime;
window.esc = esc;
window.sendMessage = sendMessage;
window.sendGif = sendGif;
window.filterEmoji = filterEmoji;
window.insertEmoji = insertEmoji;
window.toggleEmoji = toggleEmoji;
window.closeEmoji = closeEmoji;
window.toggleGif = toggleGif;
window.closeGif = closeGif;
window.loadTrending = loadTrending;
window.doGifSearch = doGifSearch;
window.renderGifs = renderGifs;
window.openTeacher = openTeacher;
window.closeTeacher = closeTeacher;
window.doTeacherLogin = doTeacherLogin;
window.initBan = initBan;
window.closeBan = closeBan;
window.doBan = doBan;
window.goBack = goBack;

};
