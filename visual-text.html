<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Observatory — Visual Text Comprehension</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0D0F1A;--surface:#13162A;--surface2:#1A1F36;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
  --text:#E8EAF6;--muted:rgba(232,234,246,0.45);
  --accent:#10B981;--accent2:#34D399;--coral:#F87171;--gold:#FBBF24;
  --radius:18px;--radius-sm:10px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 50% at 20% -10%,rgba(16,185,129,.12) 0%,transparent 60%),
  radial-gradient(ellipse 60% 40% at 80% 100%,rgba(52,211,153,.07) 0%,transparent 55%)}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 56px;position:relative;z-index:1}
.hdr{text-align:center;padding:28px 0 20px}
.hdr-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3);border-radius:99px;padding:5px 14px;margin-bottom:14px;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--accent2)}
.hdr-logo{width:70px;height:70px;background:linear-gradient(135deg,var(--accent),#059669);border-radius:24px;display:inline-flex;align-items:center;justify-content:center;font-size:34px;margin-bottom:12px;box-shadow:0 8px 32px rgba(16,185,129,.35);animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1deg)}}
.hdr-title{font-family:'Instrument Serif',serif;font-size:clamp(24px,6vw,40px);font-weight:400;color:#fff;margin-bottom:8px}
.hdr-title span{color:var(--accent2);font-style:italic}
.hdr-sub{font-size:13px;color:var(--muted)}

/* SET SELECTOR */
.set-tabs{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
.set-tab{padding:6px 14px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--border2);background:var(--surface2);color:var(--muted);cursor:pointer;transition:all .2s;font-family:inherit}
.set-tab.active{background:rgba(16,185,129,.2);border-color:var(--accent);color:var(--accent2)}

/* CARD */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:14px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent)}
.card-title{font-family:'Instrument Serif',serif;font-size:17px;color:#fff;margin-bottom:14px;display:flex;align-items:center;gap:9px}
.card-icon{width:34px;height:34px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;background:rgba(16,185,129,.15);flex-shrink:0}

/* VISUAL TEXT IMAGE */
.vtc-image-wrap{text-align:center;margin-bottom:18px}
.vtc-image{max-width:100%;border-radius:12px;border:2px solid var(--border2);box-shadow:0 8px 32px rgba(0,0,0,.4)}
.vtc-img-label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}

/* PROGRESS */
.progress-row{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.progress-bar{flex:1;height:5px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .4s}
.progress-txt{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.q-num{font-size:11px;font-weight:700;color:var(--accent2);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.q-text{font-size:15px;color:var(--text);margin-bottom:14px;line-height:1.6}

/* MCQ */
.mcq-opts{display:flex;flex-direction:column;gap:8px}
.mcq-opt{background:var(--surface2);border:1.5px solid var(--border2);border-radius:11px;padding:12px 16px;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;transition:all .2s;font-family:inherit;text-align:left}
.mcq-opt:hover{border-color:var(--accent);background:rgba(16,185,129,.1);color:#fff}
.mcq-opt.correct{border-color:var(--accent);background:rgba(52,211,153,.15);color:var(--accent2)}
.mcq-opt.wrong{border-color:var(--coral);background:rgba(248,113,113,.12);color:var(--coral)}

/* FEEDBACK */
.hint-box{display:none;margin-top:12px;padding:11px 14px;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.25);border-radius:10px;font-size:13px;color:var(--gold);font-weight:600}
.hint-box.show{display:block}
.feedback{display:none;margin-top:12px;padding:11px 14px;border-radius:10px;font-size:13px;font-weight:600;align-items:center;gap:8px}
.feedback.show{display:flex}
.feedback.ok{background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.3);color:var(--accent2)}
.feedback.bad{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);color:var(--coral)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:11px;padding:12px 22px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s}
.btn-success{background:linear-gradient(135deg,#10B981,#059669);color:#fff;box-shadow:0 4px 18px rgba(16,185,129,.4)}
.btn-success:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn-success:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-outline{background:transparent;border:1.5px solid var(--border2);color:var(--muted)}
.btn-outline:hover{border-color:var(--accent2);color:var(--accent2)}
.btn-ghost{background:rgba(255,255,255,.06);border:1px solid var(--border2);color:var(--text)}
.btn-ghost:hover{background:rgba(255,255,255,.1)}
.btn-row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}

/* RESULT */
.stat-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.stat{flex:1;min-width:75px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 14px;text-align:center}
.stat-val{font-family:'Instrument Serif',serif;font-size:26px;color:#fff}
.stat-lbl{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-top:2px}
.result-screen{display:none;text-align:center;padding:32px 0}
.result-screen.show{display:block}
.result-emoji{font-size:60px;margin-bottom:14px;animation:popIn .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{transform:scale(0)}to{transform:scale(1)}}
.result-title{font-family:'Instrument Serif',serif;font-size:34px;color:#fff;margin-bottom:6px}
.result-sub{font-size:13px;color:var(--muted);margin-bottom:22px}
.submit-note{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3);border-radius:11px;padding:12px 16px;font-size:13px;color:var(--accent2);font-weight:600;margin-bottom:16px;text-align:center}

.game-topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(13,15,26,.92);backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,.08);
  padding:8px 16px;display:flex;align-items:center;justify-content:space-between;
  margin-bottom:0;
}
.gtb-left{display:flex;align-items:center;gap:10px}
.gtb-title{font-family:'Instrument Serif',serif;font-size:16px;color:#fff}
.btn-island-return{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(0,212,190,.15);border:1px solid rgba(0,212,190,.35);
  color:#00d4be;font-size:12px;font-weight:800;
  border-radius:10px;padding:6px 14px;cursor:pointer;
  font-family:'Nunito',sans-serif;transition:all .15s;text-decoration:none;
}
.btn-island-return:hover{background:rgba(0,212,190,.25);color:#fff}
</style>
</head>
<body>

<div class="game-topbar">
  <div class="gtb-left">
    <span style="font-size:20px">🏝️</span>
    <span class="gtb-title">English Island</span>
  </div>
  <button class="btn-island-return" onclick="goBack()">🏝️ Return to Island</button>
</div>
<div class="wrap">
  <div class="hdr">
    <div class="hdr-badge">🔭 Observatory</div>
    <div class="hdr-logo">🖼️</div>
    <h1 class="hdr-title">Visual Text <span>Comprehension</span></h1>
    <p class="hdr-sub" id="heroLabel">Study the visual text and answer the questions</p>
  </div>

  <!-- Set selector -->
  <div class="card">
    <div class="card-title"><div class="card-icon">📋</div>Choose a Visual Text</div>
    <div class="set-tabs" id="setTabs"></div>
  </div>

  <!-- Quiz card -->
  <div class="card" id="quizCard" style="display:none">
    <!-- Image -->
    <div class="vtc-image-wrap" id="vtcImageWrap">
      <div class="vtc-img-label" id="vtcImgLabel">Visual Text</div>
      <img class="vtc-image" id="vtcImage" src="" alt="Visual Text">
    </div>

    <div class="progress-row">
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="progress-txt" id="progressTxt">1 / 5</div>
    </div>
    <div class="q-num" id="qNum">Question 1 of 5</div>
    <div class="q-text" id="qText"></div>
    <div class="mcq-opts" id="mcqOpts"></div>
    <div class="hint-box" id="hintBox"></div>
    <div class="feedback" id="feedback"></div>
    <div class="btn-row">
      <button class="btn btn-outline" onclick="showHint()">💡 Hint</button>
      <button class="btn btn-ghost" onclick="goBack()">← Back</button>
    </div>
  </div>

  <!-- Result -->
  <div class="result-screen" id="resultScreen">
    <div class="result-emoji" id="resultEmoji">🌟</div>
    <div class="result-title" id="resultTitle">Well Done!</div>
    <div class="result-sub" id="resultSub"></div>
    <div class="stat-row" style="max-width:300px;margin:0 auto 16px">
      <div class="stat"><div class="stat-val" id="rScore">0</div><div class="stat-lbl">Correct</div></div>
      <div class="stat"><div class="stat-val" id="rStars">0</div><div class="stat-lbl">Stars</div></div>
      <div class="stat"><div class="stat-val" id="rPts">0</div><div class="stat-lbl">Points</div></div>
    </div>
    <div class="submit-note">✅ Done! Click below to save your score and return to the island.</div>
    <div class="btn-row" style="justify-content:center;flex-direction:column;align-items:center;gap:10px">
      <button class="btn btn-success" id="submitBtn" onclick="doSubmit()">📤 Submit Score & Return to Island</button>
      <button class="btn btn-ghost" onclick="restart()">↩ Try Again</button>
      <button class="btn btn-island-return" style="padding:12px 22px;font-size:14px" onclick="goBack()">🏝️ Back to Island</button>
    </div>
  </div>
</div>

<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbwihbBr7sA6LvqLTAUD6wK-xoUgslCkyqWenIWYxnRPidn85ihhqcbwKW8I_dcFF_uzOw/exec';
const urlP=new URLSearchParams(location.search);
const hero={name:urlP.get('hero')||'Student',cls:urlP.get('cls')||'',returnTo:urlP.get('returnTo')||'student-portal.html'};
document.getElementById('heroLabel').textContent='Hello, '+hero.name+'! 👋';

// ── VTC SETS ───────────────────────────────────────────────────────────────
// Each set has: title, imageUrl (update with your actual hosted image URLs),
// and 5 questions with MCQ options
// To add your real images: replace imageUrl with the GitHub Pages URL of the image
// e.g. 'https://thealansensei-cps.github.io/cantonment-assets/vtc1.jpg'
// ──────────────────────────────────────────────────────────────────────────
const VTC_SETS = [
  {
    id:'vtc1', title:'Advertisement',
    imageUrl:'https://thealansensei-cps.github.io/cantonment-assets/vtc1.jpg',
    imgLabel:'Visual Text 1 — Advertisement',
    questions:[
      {q:'What is the main purpose of this advertisement?',
       opts:['To inform readers about a new shop opening','To persuade readers to buy a product or service','To entertain readers with a funny story','To educate readers about healthy living'],
       answer:1, hint:'Advertisements are usually designed to persuade.'},
      {q:'Which feature of the advertisement is most likely to attract attention first?',
       opts:['The small print at the bottom','The large headline or image at the top','The contact details','The background colour'],
       answer:1, hint:'Eye-catching elements are usually placed prominently.'},
      {q:'What does the use of exclamation marks in the advertisement suggest?',
       opts:['The writer is angry','The advertisement is meant to be scary','The advertisement wants to create excitement','The price is very high'],
       answer:2, hint:'Exclamation marks convey strong emotion or excitement.'},
      {q:'Which word best describes the tone of this advertisement?',
       opts:['Sad and serious','Energetic and persuasive','Calm and informative','Angry and forceful'],
       answer:1, hint:'Think about the emotions the advertisement tries to create.'},
      {q:'Who is the most likely target audience for this advertisement?',
       opts:['Young children aged 2-5','Elderly people over 70','The general public or specific group mentioned','Only working adults'],
       answer:2, hint:'Look at the language and images used — who do they appeal to?'}
    ]
  },
  {
    id:'vtc2', title:'Poster',
    imageUrl:'https://thealansensei-cps.github.io/cantonment-assets/vtc2.jpg',
    imgLabel:'Visual Text 2 — Poster',
    questions:[
      {q:'What is the main message of this poster?',
       opts:['To warn people about danger','To raise awareness or promote an event or cause','To sell a product','To provide travel information'],
       answer:1, hint:'Posters are usually created to spread a message or promote something.'},
      {q:'Why are bold or large fonts used in the poster?',
       opts:['To fill up space','To make the poster look colourful','To emphasise key information','Because the designer made a mistake'],
       answer:2, hint:'Size and boldness are used to highlight important text.'},
      {q:'What does the image or graphic on the poster represent?',
       opts:['Random decoration','A symbol that supports the main message','An error by the designer','Something unrelated to the text'],
       answer:1, hint:'Images in posters are chosen carefully to support the message.'},
      {q:'Which design feature makes this poster effective?',
       opts:['Using only black and white colours','Having no images','Using contrasting colours and clear fonts','Writing very long sentences'],
       answer:2, hint:'Effective posters use visual contrast and clear, short text.'},
      {q:'What action does this poster want its audience to take?',
       opts:['To ignore the issue','To buy something immediately','To take a specific action related to the message','To call a phone number'],
       answer:2, hint:'Posters usually end with a call to action.'}
    ]
  },
  {
    id:'vtc3', title:'Table / Chart',
    imageUrl:'https://thealansensei-cps.github.io/cantonment-assets/vtc3.jpg',
    imgLabel:'Visual Text 3 — Table or Chart',
    questions:[
      {q:'What is the purpose of presenting information in a table?',
       opts:['To make the page look busy','To organise information clearly for easy comparison','To hide important data','To confuse the reader'],
       answer:1, hint:'Tables are used to organise and compare data efficiently.'},
      {q:'Which part of the table tells you what each column means?',
       opts:['The last row','The column headers at the top','The footnotes','The table number'],
       answer:1, hint:'Column headers label the type of information in each column.'},
      {q:'If you wanted to compare two rows of data, what would you look at?',
       opts:['Only the first column','The values across the same row for both items','The title of the table only','The colour of the cells'],
       answer:1, hint:'To compare, look at the same columns for different rows.'},
      {q:'What does a blank cell in a table most likely mean?',
       opts:['The information is secret','No data is available for that category','The table is incomplete by mistake','The number is zero'],
       answer:1, hint:'Blank cells usually mean the data is not available or not applicable.'},
      {q:'Which conclusion can you draw from reading a table carefully?',
       opts:['Tables never tell us anything useful','You can identify patterns, highest and lowest values','Tables are only for scientists','You can only see one piece of information at a time'],
       answer:1, hint:'Tables allow us to spot trends and make comparisons across multiple data points.'}
    ]
  }
];

// ── STATE ─────────────────────────────────────────────────────────────────
let currentSet=null, qi=0, score=0, answered=false, submitted=false;

// Build tabs
const tabsEl=document.getElementById('setTabs');
VTC_SETS.forEach((s,i)=>{
  const btn=document.createElement('button');
  btn.className='set-tab'+(i===0?' active':'');
  btn.textContent=s.title;
  btn.onclick=()=>loadSet(s,btn);
  tabsEl.appendChild(btn);
});
loadSet(VTC_SETS[0], tabsEl.children[0]);

function loadSet(s, tabBtn){
  currentSet=s; qi=0; score=0; answered=false; submitted=false;
  document.querySelectorAll('.set-tab').forEach(t=>t.classList.remove('active'));
  if(tabBtn) tabBtn.classList.add('active');
  // Update image
  document.getElementById('vtcImgLabel').textContent = s.imgLabel;
  const img = document.getElementById('vtcImage');
  img.src = s.imageUrl;
  img.onerror = function(){
    // If image not found, show placeholder
    this.style.display='none';
    document.getElementById('vtcImageWrap').innerHTML=
      `<div style="background:rgba(255,255,255,.05);border:2px dashed rgba(255,255,255,.15);border-radius:12px;padding:32px;text-align:center;color:rgba(255,255,255,.4)">
        <div style="font-size:40px;margin-bottom:8px">🖼️</div>
        <div style="font-size:13px;font-weight:700">${s.imgLabel}</div>
        <div style="font-size:11px;margin-top:4px">Upload image to: ${s.imageUrl}</div>
      </div>`;
  };
  img.style.display='block';
  document.getElementById('quizCard').style.display='block';
  document.getElementById('resultScreen').classList.remove('show');
  renderQ();
}

function renderQ(){
  const q=currentSet.questions[qi];
  const total=currentSet.questions.length;
  document.getElementById('progressFill').style.width=((qi+1)/total*100)+'%';
  document.getElementById('progressTxt').textContent=(qi+1)+' / '+total;
  document.getElementById('qNum').textContent='Question '+(qi+1)+' of '+total;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('hintBox').className='hint-box';
  document.getElementById('feedback').className='feedback';
  answered=false;
  document.getElementById('mcqOpts').innerHTML=q.opts.map((o,i)=>
    `<button class="mcq-opt" onclick="pickOpt(${i},this)">${String.fromCharCode(65+i)}. ${o}</button>`
  ).join('');
}

function pickOpt(i,btn){
  if(answered)return; answered=true;
  const q=currentSet.questions[qi];
  const opts=document.querySelectorAll('.mcq-opt');
  opts.forEach(o=>o.style.pointerEvents='none');
  if(i===q.answer){
    score++; btn.classList.add('correct');
    const fb=document.getElementById('feedback');fb.className='feedback show ok';fb.textContent='✅ Correct!';
  } else {
    btn.classList.add('wrong'); opts[q.answer].classList.add('correct');
    const fb=document.getElementById('feedback');fb.className='feedback show bad';fb.textContent='❌ Not quite. The correct answer is highlighted.';
  }
  setTimeout(()=>{
    if(qi<currentSet.questions.length-1){qi++;renderQ();}
    else showResult();
  },1400);
}

function showHint(){
  const h=document.getElementById('hintBox');
  h.textContent='💡 '+currentSet.questions[qi].hint;
  h.classList.add('show');
}

function showResult(){
  const total=currentSet.questions.length;
  const pct=Math.round(score/total*100);
  const stars=pct>=90?3:pct>=70?2:pct>=50?1:0;
  document.getElementById('quizCard').style.display='none';
  document.getElementById('resultScreen').classList.add('show');
  document.getElementById('resultEmoji').textContent=stars===3?'🏆':stars===2?'🌟':stars===1?'⭐':'💪';
  document.getElementById('resultTitle').textContent=stars===3?'Perfect!':stars===2?'Great Work!':stars===1?'Good Try!':'Keep Practising!';
  document.getElementById('resultSub').textContent='You got '+score+'/'+total+' correct on "'+currentSet.title+'"';
  document.getElementById('rScore').textContent=score;
  document.getElementById('rStars').textContent=stars;
  document.getElementById('rPts').textContent='+'+(score*10);
}

async function doSubmit(){
  if(submitted)return;
  const btn=document.getElementById('submitBtn');
  btn.disabled=true; btn.textContent='⏳ Submitting...';
  submitted=true;
  const total=currentSet.questions.length;
  const pct=Math.round(score/total*100);
  const stars=pct>=90?3:pct>=70?2:pct>=50?1:0;
  // POST to Google Sheets
  try{
    await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify({
      action:'saveScore',name:hero.name,cls:hero.cls,
      zone:'vt',topic:currentSet.title,
      score,total,stars,coins:score*10,
      ts:new Date().toISOString()
    })});
  }catch(e){console.warn('Sheet error:',e)}
  // Return to portal with score params
  const ret=hero.returnTo
    +'?hero='+encodeURIComponent(hero.name)
    +'&cls='+encodeURIComponent(hero.cls)
    +'&zone=vt'
    +'&score='+score
    +'&total='+total
    +'&stars='+stars;
  window.location.href=ret;
}

function restart(){
  loadSet(currentSet, document.querySelector('.set-tab.active'));
}
function goBack(){
  window.location.href=hero.returnTo
    +'?hero='+encodeURIComponent(hero.name)
    +'&cls='+encodeURIComponent(hero.cls);
}
</script>
</body>
</html>
